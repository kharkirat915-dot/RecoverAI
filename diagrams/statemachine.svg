<svg viewBox="0 0 1100 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1100" height="400" fill="#ffffff"/>

  <circle cx="40" cy="100" r="10" fill="#334155"/>
  <line x1="50" y1="100" x2="90" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="90" y="70" width="160" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="105" text-anchor="middle" font-size="13" fill="#7f1d1d">FailureDetected</text>
  <line x1="250" y1="100" x2="300" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="275" y="90" text-anchor="middle" font-size="9" fill="#475569">Gemini triggered</text>

  <rect x="300" y="70" width="140" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="105" text-anchor="middle" font-size="13" fill="#14532d">Analyzing</text>
  <line x1="440" y1="100" x2="490" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="465" y="90" text-anchor="middle" font-size="9" fill="#475569">decision returned</text>

  <rect x="490" y="70" width="160" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="570" y="105" text-anchor="middle" font-size="13" fill="#312e81">ActionChosen</text>

  <!-- branch down to escalated, right to recoveryinprogress -->
  <line x1="650" y1="100" x2="700" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="675" y="90" text-anchor="middle" font-size="9" fill="#475569">constraints passed</text>

  <rect x="700" y="70" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="790" y="97" text-anchor="middle" font-size="12" fill="#1e3a8a">RecoveryIn</text>
  <text x="790" y="113" text-anchor="middle" font-size="12" fill="#1e3a8a">Progress</text>

  <line x1="570" y1="130" x2="570" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="640" y="185" text-anchor="middle" font-size="9" fill="#475569">high risk / high amount</text>

  <rect x="490" y="220" width="160" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="570" y="255" text-anchor="middle" font-size="13" fill="#78350f">Escalated</text>
  <line x1="570" y1="280" x2="570" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <circle cx="570" cy="335" r="10" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="570" cy="335" r="5" fill="#334155"/>

  <!-- recovery in progress branches -->
  <line x1="880" y1="90" x2="960" y2="60" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="940" y="55" text-anchor="middle" font-size="9" fill="#475569">succeeded</text>
  <rect x="960" y="30" width="120" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1020" y="62" text-anchor="middle" font-size="13" fill="#14532d">Recovered</text>
  <line x1="1020" y1="85" x2="1020" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <circle cx="1020" cy="145" r="10" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="1020" cy="145" r="5" fill="#334155"/>

  <line x1="880" y1="110" x2="960" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="940" y="175" text-anchor="middle" font-size="9" fill="#475569">failed</text>
  <rect x="960" y="180" width="120" height="55" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1020" y="212" text-anchor="middle" font-size="13" fill="#7f1d1d">Lost</text>
  <line x1="1020" y1="235" x2="1020" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#arrow3)"/>
  <circle cx="1020" cy="285" r="10" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="1020" cy="285" r="5" fill="#334155"/>
</svg>
