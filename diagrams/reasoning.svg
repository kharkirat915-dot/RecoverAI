<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#ffffff"/>

  <rect x="20" y="200" width="180" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="235" text-anchor="middle" font-size="13" fill="#7f1d1d">Failure Reason</text>
  <text x="110" y="253" text-anchor="middle" font-size="13" fill="#7f1d1d">+ Amount</text>
  <line x1="200" y1="240" x2="250" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="250" y="200" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="245" text-anchor="middle" font-size="14" fill="#14532d">Gemini Prompt</text>
  <line x1="410" y1="240" x2="460" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="460" y="190" width="200" height="100" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="560" y="230" text-anchor="middle" font-size="13" fill="#312e81">Structured JSON</text>
  <text x="560" y="248" text-anchor="middle" font-size="13" fill="#312e81">Response</text>

  <!-- 6 outputs fan out -->
  <line x1="660" y1="240" x2="700" y2="60"  stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="660" y1="240" x2="700" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="660" y1="240" x2="700" y2="215" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="660" y1="240" x2="700" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="660" y1="240" x2="700" y2="365" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="660" y1="240" x2="700" y2="440" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="700" y="30"  width="470" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="935" y="60" text-anchor="middle" font-size="13" fill="#713f12">Recommended Action</text>

  <rect x="700" y="110" width="470" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="935" y="140" text-anchor="middle" font-size="13" fill="#713f12">Confidence Score</text>

  <rect x="700" y="190" width="470" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="935" y="212" text-anchor="middle" font-size="12" fill="#713f12">Why This Was Selected</text>
  <text x="935" y="230" text-anchor="middle" font-size="10" fill="#713f12">(Failure Pattern, Recovery Likelihood, Cost-Benefit)</text>

  <rect x="700" y="265" width="470" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="935" y="288" text-anchor="middle" font-size="12" fill="#713f12">Constraint Checks (Passed / Failed)</text>

  <rect x="700" y="340" width="470" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="935" y="370" text-anchor="middle" font-size="13" fill="#713f12">Customer Recovery Message</text>

  <rect x="700" y="415" width="470" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="935" y="445" text-anchor="middle" font-size="13" fill="#713f12">Escalate Flag (true / false)</text>
</svg>
