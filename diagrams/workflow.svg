<svg viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="1500" fill="#ffffff"/>

  <!-- Box style helper via repeated rects -->
  <!-- 1 -->
  <rect x="350" y="20" width="300" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="55" text-anchor="middle" font-size="16" fill="#7f1d1d">Payment Fails</text>
  <line x1="500" y1="80" x2="500" y2="110" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="300" y="110" width="400" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" font-size="16" fill="#312e81">Failure Detected by Backend</text>
  <line x1="500" y1="170" x2="500" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="250" y="200" width="500" height="80" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="500" y="230" text-anchor="middle" font-size="15" fill="#312e81">Failure Classified</text>
  <text x="500" y="250" text-anchor="middle" font-size="12" fill="#312e81">insufficient_funds · card_expired</text>
  <text x="500" y="266" text-anchor="middle" font-size="12" fill="#312e81">bank_timeout · risk_declined</text>
  <line x1="500" y1="280" x2="500" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect x="300" y="310" width="400" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="345" text-anchor="middle" font-size="16" fill="#14532d">Gemini AI Analysis Triggered</text>
  <line x1="500" y1="370" x2="500" y2="400" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 diamond -->
  <polygon points="500,400 660,450 500,500 340,450" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="500" y="446" text-anchor="middle" font-size="13" fill="#713f12">Structured</text>
  <text x="500" y="462" text-anchor="middle" font-size="13" fill="#713f12">Reasoning Generated</text>

  <!-- branch to three -->
  <line x1="500" y1="500" x2="500" y2="540" stroke="#334155" stroke-width="2"/>
  <line x1="220" y1="560" x2="780" y2="560" stroke="#334155" stroke-width="2"/>
  <line x1="220" y1="560" x2="220" y2="580" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="560" x2="500" y2="580" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="560" x2="780" y2="580" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- three boxes -->
  <rect x="60" y="580" width="320" height="60" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="220" y="615" text-anchor="middle" font-size="13" fill="#581c87">Failure Pattern Identified</text>

  <rect x="340" y="580" width="320" height="60" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="500" y="615" text-anchor="middle" font-size="13" fill="#581c87">Recovery Likelihood Estimated</text>

  <rect x="620" y="580" width="320" height="60" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="780" y="615" text-anchor="middle" font-size="13" fill="#581c87">Cost-Benefit Evaluated</text>

  <!-- converge -->
  <line x1="220" y1="640" x2="220" y2="670" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="640" x2="500" y2="670" stroke="#334155" stroke-width="2"/>
  <line x1="780" y1="640" x2="780" y2="670" stroke="#334155" stroke-width="2"/>
  <line x1="220" y1="670" x2="780" y2="670" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="670" x2="500" y2="700" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- constraint checks -->
  <rect x="330" y="700" width="340" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="735" text-anchor="middle" font-size="15" fill="#1e3a8a">Constraint Checks</text>
  <line x1="500" y1="760" x2="500" y2="790" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision diamond -->
  <polygon points="500,790 700,850 500,910 300,850" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="500" y="846" text-anchor="middle" font-size="13" fill="#713f12">All Constraints</text>
  <text x="500" y="862" text-anchor="middle" font-size="13" fill="#713f12">Passed?</text>

  <!-- yes branch -->
  <line x1="300" y1="850" x2="140" y2="850" stroke="#334155" stroke-width="2"/>
  <text x="220" y="840" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">YES — Low Risk</text>
  <line x1="140" y1="850" x2="140" y2="900" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="10" y="900" width="260" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="930" text-anchor="middle" font-size="12" fill="#14532d">Recovery Action Executed</text>
  <text x="140" y="948" text-anchor="middle" font-size="11" fill="#14532d">Smart Retry / Payment Link /</text>
  <text x="140" y="964" text-anchor="middle" font-size="11" fill="#14532d">Incentivized Retry</text>

  <!-- no branch -->
  <line x1="700" y1="850" x2="860" y2="850" stroke="#334155" stroke-width="2"/>
  <text x="780" y="840" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">NO — High Risk/Amount</text>
  <line x1="860" y1="850" x2="860" y2="900" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="730" y="900" width="260" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="860" y="935" text-anchor="middle" font-size="12" fill="#7f1d1d">Escalated for</text>
  <text x="860" y="953" text-anchor="middle" font-size="12" fill="#7f1d1d">Human Review</text>

  <!-- converge to outcome logged -->
  <line x1="140" y1="980" x2="140" y2="1010" stroke="#334155" stroke-width="2"/>
  <line x1="860" y1="980" x2="860" y2="1010" stroke="#334155" stroke-width="2"/>
  <line x1="140" y1="1010" x2="860" y2="1010" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="1010" x2="500" y2="1040" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="1040" width="340" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="500" y="1075" text-anchor="middle" font-size="15" fill="#312e81">Outcome Logged</text>
  <line x1="500" y1="1100" x2="500" y2="1130" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="1130" width="500" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="500" y="1165" text-anchor="middle" font-size="14" fill="#312e81">Audit Trail Updated (Timestamped State History)</text>
  <line x1="500" y1="1190" x2="500" y2="1220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="1220" width="540" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="1252" text-anchor="middle" font-size="14" fill="#14532d">Dashboard Updated</text>
  <text x="500" y="1272" text-anchor="middle" font-size="12" fill="#14532d">Revenue Recovered / Recovery Rate / Active Attempts</text>
</svg>
